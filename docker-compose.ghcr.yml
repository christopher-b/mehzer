# Mehzur from the published image, for a server that only needs this file and a .env (no source code):
#
#   docker compose -f docker-compose.ghcr.yml up -d
#   docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d   # update
#
# Behind Traefik, add the override: -f docker-compose.ghcr.yml -f docker-compose.traefik.yml
# Settings are described in docs/deployment.md. Pin a version with MEHZUR_TAG (default: latest).
name: mehzur
services:
  mehzur:
    image: ghcr.io/christopher-b/mehzur:${MEHZUR_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      PLAIN_HTTP: ${PLAIN_HTTP:-true}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-}
      HOST_HEADER: ${HOST_HEADER:-}
      # Accounts and email (see docs/deployment.md). Email is optional: without SMTP_HOST, invites are shared by
      # copying the link and "forgot password" asks people to contact the administrator.
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Mehzur <mehzur@cbennell.com>}
      # Behind a proxy, the header that carries the visitor's address (for limiting failed sign-ins).
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
    volumes:
      - mehzur-data:/data

volumes:
  mehzur-data:
