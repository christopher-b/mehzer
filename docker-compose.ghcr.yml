# Mehzer from the published image, for a server that only needs this file and a .env (no source code):
#
#   docker compose -f docker-compose.ghcr.yml up -d
#   docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d   # update
#
# Behind Traefik, add the override: -f docker-compose.ghcr.yml -f docker-compose.traefik.yml
# Settings are described in docs/deployment.md. Pin a version with MEHZER_TAG (default: latest).
name: mehzer
services:
  mehzer:
    image: ghcr.io/christopher-b/mehzer:${MEHZER_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      PLAIN_HTTP: ${PLAIN_HTTP:-true}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-}
      HOST_HEADER: ${HOST_HEADER:-}
    volumes:
      - mehzer-data:/data

volumes:
  mehzer-data:
