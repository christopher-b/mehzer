# Mehzur behind Traefik (which terminates https). Use it on top of the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#
# Set in .env: APP_PASSWORD, SESSION_SECRET, MEHZUR_HOST (the public host name, for example mehzur.example.com),
# and PLAIN_HTTP=false, PROTOCOL_HEADER=x-forwarded-proto, HOST_HEADER=x-forwarded-host.
# Assumes Traefik runs with the Docker provider, an `websecure` entry point, and a Docker network
# named by TRAEFIK_NETWORK (default `traefik`) that it shares with this service.
services:
  mehzur:
    # Traefik reaches the container over the shared network; nothing is published on the host.
    ports: !reset []
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.mehzur.rule: Host(`${MEHZUR_HOST:?Set MEHZUR_HOST in .env}`)
      traefik.http.routers.mehzur.entrypoints: websecure
      traefik.http.routers.mehzur.tls: "true"
      # Add this line for Let's Encrypt, using the name of your certificate resolver:
      # traefik.http.routers.mehzur.tls.certresolver: letsencrypt
      traefik.http.services.mehzur.loadbalancer.server.port: "3000"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
