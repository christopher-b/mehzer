# Mehzur, self-hosted. See docs/deployment.md (behind Traefik: also docker-compose.traefik.yml).
#
#   cp .env.example .env     # then set APP_PASSWORD and SESSION_SECRET
#   docker compose up -d --build
#
# Photos and the SQLite database persist in the `mehzur-data` volume.
name: mehzur
services:
  mehzur:
    build: .
    image: mehzur:latest
    init: true
    restart: unless-stopped
    ports:
      # Change the left side to use another port. To expose it only to a reverse proxy running on
      # the same machine, use "127.0.0.1:3000:3000".
      - "${PORT:-3000}:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # true: served over plain http (home/LAN). false: behind an https reverse proxy, in which
      # case also set PROTOCOL_HEADER=x-forwarded-proto (and HOST_HEADER=x-forwarded-host).
      PLAIN_HTTP: ${PLAIN_HTTP:-true}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-}
      HOST_HEADER: ${HOST_HEADER:-}
      # Accounts and email (see docs/deployment.md). Email is optional: without SMTP_HOST, invites are shared by
      # copying the link and "forgot password" asks people to contact the administrator.
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Mehzur <mehzur@cbennell.com>}
      # Behind a proxy, the header that carries the visitor's address (for limiting failed sign-ins).
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
    volumes:
      - mehzur-data:/data

volumes:
  mehzur-data:
